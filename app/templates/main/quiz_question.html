{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">{{ quiz.title }}</h1>
      <div class="text-xl font-bold text-red-600" id="timer">01:00</div>
    </div>
    
    <!-- Progress bar -->
    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
      <div class="bg-blue-600 h-2.5 rounded-full" style="width: {{ progress }}%"></div>
    </div>
    
    <div class="mb-6">
      <p class="text-sm text-gray-500 mb-1">Question {{ question_index + 1 }} of {{ total_questions }}</p>
      <h2 class="text-xl font-semibold mb-4">{{ question.question_text }}</h2>
      
      <form id="questionForm" action="{{ url_for('main.submit_answer', question_index=question_index) }}" method="POST">
        <div class="space-y-3">
          {% for option in options %}
            <div class="flex items-center">
              <input type="radio" id="option{{ option.id }}" name="option_id" value="{{ option.id }}" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
              <label for="option{{ option.id }}" class="ml-2 block text-gray-700">
                {{ option.option_text }}
              </label>
            </div>
          {% endfor %}
        </div>
        
        <div class="mt-6">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded">
            Next Question
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // One-minute timer
  let timeLeft = 60; // 60 seconds = 1 minute
  const timerElement = document.getElementById('timer');
  
  const timer = setInterval(function() {
    timeLeft--;
    
    // Format time as MM:SS
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    
    // When time is up, submit the form
    if (timeLeft <= 0) {
      clearInterval(timer);
      document.getElementById('questionForm').submit();
    }
  }, 1000);
</script>
{% endblock %}
