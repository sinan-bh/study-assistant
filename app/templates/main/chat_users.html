{% extends 'base.html' %}

{% block content %}
<div class="flex">
  <!-- Chat Users Sidebar -->
  <div class="w-64 bg-gray-100 min-h-screen p-4 border-r">
    <h2 class="text-xl font-bold mb-6">Chat Messages</h2>
    <ul class="space-y-2">
      {% for user in users %}
        <li>
          <a href="{{ url_for('main.admin_chat', user_id=user.id) }}" class="flex items-center hover:bg-gray-200 px-3 py-2 rounded-md {% if current_user.id == user.id %}bg-blue-100{% endif %}">
            <i class="fas fa-user-circle mr-3 text-gray-500"></i>
            <span>{{ user.username }}</span>
          </a>
        </li>
      {% else %}
        <li class="text-gray-500 italic px-3 py-2">No chat messages yet</li>
      {% endfor %}
    </ul>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-8">
    <div class="text-center text-gray-500">
      <i class="fas fa-comments text-6xl mb-4"></i>
      <p>Select a user to view chat messages</p>
    </div>
  </div>
</div>
{% endblock %}
