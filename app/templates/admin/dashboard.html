{% extends 'admin/base_admin.html' %}

{% block admin_content %}
  <h1 class="text-2xl font-bold mb-6">Admin Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Total Users Card -->
    <div class="bg-blue-100 p-6 rounded-lg shadow">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-semibold text-blue-800">Total Users</h3>
          <p class="text-3xl font-bold text-blue-600">{{ total_users }}</p>
        </div>
        <div class="bg-blue-200 p-3 rounded-full">
          <i class="fas fa-users text-blue-600 text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Active Users Card -->
    <div class="bg-green-100 p-6 rounded-lg shadow">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-semibold text-green-800">Active Users</h3>
          <p class="text-3xl font-bold text-green-600">{{ active_users }}</p>
        </div>
        <div class="bg-green-200 p-3 rounded-full">
          <i class="fas fa-user-check text-green-600 text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Blocked Users Card -->
    <div class="bg-red-100 p-6 rounded-lg shadow">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-semibold text-red-800">Blocked Users</h3>
          <p class="text-3xl font-bold text-red-600">{{ inactive_users }}</p>
        </div>
        <div class="bg-red-200 p-3 rounded-full">
          <i class="fas fa-user-slash text-red-600 text-xl"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8">
    <h2 class="text-xl font-semibold mb-4">Quick Actions</h2>
    <div class="flex space-x-4">
      <a href="{{ url_for('admin.users') }}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md flex items-center"><i class="fas fa-users mr-2"></i> Manage Users</a>
    </div>
  </div>
{% endblock %}
