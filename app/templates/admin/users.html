{% extends 'admin/base_admin.html' %}

{% block admin_content %}
  <h1 class="text-2xl font-bold mb-6">Manage Users</h1>
  
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white">
      <thead>
        <tr class="bg-gray-100 text-gray-700 uppercase text-sm leading-normal">
          <th class="py-3 px-6 text-left">ID</th>
          <th class="py-3 px-6 text-left">Username</th>
          <th class="py-3 px-6 text-left">Email</th>
          <th class="py-3 px-6 text-center">Status</th>
          <th class="py-3 px-6 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="text-gray-600 text-sm">
        {% for user in users %}
          <tr class="border-b border-gray-200 hover:bg-gray-50">
            <td class="py-3 px-6 text-left">{{ user.id }}</td>
            <td class="py-3 px-6 text-left">{{ user.username }}</td>
            <td class="py-3 px-6 text-left">{{ user.email }}</td>
            <td class="py-3 px-6 text-center">
              {% if user.is_active %}
                <span class="bg-green-200 text-green-700 py-1 px-3 rounded-full text-xs">Active</span>
              {% else %}
                <span class="bg-red-200 text-red-700 py-1 px-3 rounded-full text-xs">Blocked</span>
              {% endif %}
            </td>
            <td class="py-3 px-6 text-center">
              <div class="flex item-center justify-center">
                <a href="{{ url_for('admin.user_detail', user_id=user.id) }}" class="w-4 mr-2 transform hover:text-blue-500 hover:scale-110">
                  <i class="fas fa-eye"></i>
                </a>
                <button 
                  onclick="toggleUserStatus({{ user.id }}, '{{ user.username }}', {{ user.is_active|tojson }})"
                  class="w-4 mr-2 transform hover:text-yellow-500 hover:scale-110">
                  {% if user.is_active %}
                    <i class="fas fa-ban"></i>
                  {% else %}
                    <i class="fas fa-check"></i>
                  {% endif %}
                </button>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- JavaScript for toggling user status -->
  <script>
    function toggleUserStatus(userId, username, isActive) {
      if (confirm(`Are you sure you want to ${isActive ? 'block' : 'activate'} user ${username}?`)) {
        fetch(`/admin/users/${userId}/toggle_status`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert(data.message);
            location.reload();
          } else {
            alert(data.message || 'An error occurred');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred while processing your request');
        });
      }
    }
  </script>
{% endblock %}
