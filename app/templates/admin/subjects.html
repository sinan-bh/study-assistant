{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<div class="bg-white rounded-lg p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-900">All Subjects</h2>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full bg-white">
      <thead class="bg-gray-100">
        <tr>
          <th class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Daily Study Time</th>
          <th class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
          <th class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {% for subject in subjects %}
        <tr>
          <td class="py-4 px-4">
            <div class="flex items-center">
              <div class="h-4 w-4 rounded-full mr-3" style="background-color: {{ subject.color }}"></div>
              <span>{{ subject.name }}</span>
            </div>
          </td>
          <td class="py-4 px-4">{{ subject.daily_time_minutes }} min</td>
          <td class="py-4 px-4">{{ subject.user.username }}</td>
          <td class="py-4 px-4">
            <a href="{{ url_for('admin.subject_detail', subject_id=subject.id) }}" class="text-blue-600 hover:text-blue-800 mr-3">View</a>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" class="py-4 px-4 text-center text-gray-500">No subjects found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
